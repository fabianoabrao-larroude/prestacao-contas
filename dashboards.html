<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboards – Prestação de Contas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
</head>
<body class="bg-slate-50">
  <div id="app-loading" class="fixed inset-0 bg-white flex items-center justify-center z-50">
    <div class="text-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-2"></div><p class="text-sm text-slate-500">Carregando…</p></div>
  </div>
  <div id="app" class="hidden flex h-screen overflow-hidden">
    <div id="sidebar-container" class="flex-shrink-0"></div>
    <main class="flex-1 overflow-y-auto">
      <div class="p-6 max-w-7xl mx-auto">

        <div class="mb-6">
          <h1 class="text-2xl font-bold text-slate-900">Dashboards</h1>
          <p class="text-sm text-slate-500 mt-1">Visão de gastos por cartão corporativo — despesas aprovadas</p>
        </div>

        <!-- Filtros reativos: mudou, já recarrega, sem botão "Aplicar" -->
        <div class="bg-white rounded-xl border border-slate-200 p-4 mb-6">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Competência inicial</label>
              <input id="f-de" type="month" class="w-full px-2 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Competência final</label>
              <input id="f-ate" type="month" class="w-full px-2 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Centro de Custo</label>
              <select id="f-centro" class="w-full px-2 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Todos</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Cartão</label>
              <select id="f-cartao" class="w-full px-2 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Todos</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Total período -->
        <div class="bg-white rounded-xl border border-slate-200 p-5 mb-6">
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Aprovado no Período</p>
          <p class="text-3xl font-bold text-slate-900 mt-1" id="total-geral">–</p>
          <p class="text-xs text-slate-400 mt-1" id="total-geral-qtd">– despesas</p>
        </div>

        <!-- Acompanhamento mensal -->
        <div class="bg-white rounded-xl border border-slate-200 p-5 mb-6">
          <p class="text-sm font-semibold text-slate-700 mb-3">Acompanhamento Mensal</p>
          <div class="h-64"><canvas id="chart-mensal"></canvas></div>
        </div>

        <!-- Grid de Top 10 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="grid-top10"></div>

      </div>
    </main>
  </div>

  <script>
    let currentUser  = null;
    let despesasAll  = [];
    let chartMensal  = null;
    const chartsTop10 = {};

    const CORES = ['#3b82f6','#64748b','#8b5cf6','#0ea5e9','#f59e0b','#10b981','#ef4444','#ec4899','#14b8a6','#f97316'];

    const DIMENSOES = [
      { id: 'fornecedores', titulo: 'Top 10 Fornecedores', chave: d => d.fornecedor_compra_nome_snapshot || d.fornecedor || '–' },
      { id: 'usuarios',     titulo: 'Top 10 Usuários',     chave: d => d.usuarios?.nome || '–' },
      { id: 'contas',       titulo: 'Top 10 Tipo de Despesa', chave: d => d.contas_despesa?.nome || '–' },
      { id: 'centros',      titulo: 'Top 10 Centros de Custo', chave: d => d.centros_custo?.nome || '–' },
      { id: 'bandeiras',    titulo: 'Top 10 Bandeiras',    chave: d => d.cartoes_credito?.bandeira || '–' },
      { id: 'cartoes',      titulo: 'Top 10 Cartões',      chave: d => d.cartoes_credito?.nome || '–' },
      { id: 'aprov-centro', titulo: 'Top 10 Aprovadores (Centro)', chave: d => d.aprovador_centro?.nome || '–' },
      { id: 'aprov-cartao', titulo: 'Top 10 Aprovadores (Cartão)', chave: d => d.aprovador_cartao?.nome || '–' },
    ];

    function montarGridCards() {
      const grid = document.getElementById('grid-top10');
      grid.innerHTML = DIMENSOES.map(dim => `
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <p class="text-sm font-semibold text-slate-700 mb-3">${dim.titulo}</p>
          <div class="h-48 mb-4"><canvas id="chart-${dim.id}"></canvas></div>
          <div id="lista-${dim.id}" class="space-y-1.5"></div>
        </div>`).join('');
    }

    async function popularFiltros() {
      const [{ data: cc }, { data: cart }] = await Promise.all([
        supabase.from('centros_custo').select('id, nome').eq('ativo', true).order('nome'),
        supabase.from('cartoes_credito').select('id, nome').eq('ativo', true).order('nome'),
      ]);
      Utils.populateSelect(document.getElementById('f-centro'), cc || [], 'id', 'nome');
      Utils.populateSelect(document.getElementById('f-cartao'), cart || [], 'id', 'nome');
    }

    async function carregar() {
      const de     = document.getElementById('f-de').value;
      const ate    = document.getElementById('f-ate').value;
      const centro = document.getElementById('f-centro').value;
      const cartao = document.getElementById('f-cartao').value;

      let q = supabase
        .from('despesas')
        .select(`id, valor, competencia, fornecedor, fornecedor_compra_nome_snapshot,
                 usuarios!despesas_usuario_id_fkey(nome),
                 centros_custo(nome), contas_despesa(nome),
                 cartoes_credito(nome, bandeira),
                 aprovador_centro:usuarios!despesas_aprovado_por_usuario_id_fkey(nome),
                 aprovador_cartao:usuarios!despesas_aprovado_cartao_por_usuario_id_fkey(nome)`)
        .eq('status', 'APROVADA');

      if (de)     q = q.gte('competencia', de);
      if (ate)    q = q.lte('competencia', ate);
      if (centro) q = q.eq('centro_custo_id', centro);
      if (cartao) q = q.eq('cartao_id', cartao);

      const { data, error } = await q;
      if (error) { Utils.toast(error.message, 'error'); return; }
      despesasAll = data || [];

      renderTotal();
      renderMensal();
      DIMENSOES.forEach(renderTop10);
    }

    function renderTotal() {
      const total = despesasAll.reduce((s, d) => s + Number(d.valor), 0);
      document.getElementById('total-geral').textContent = Utils.formatCurrency(total);
      document.getElementById('total-geral-qtd').textContent = `${despesasAll.length} despesa(s)`;
    }

    function renderMensal() {
      const porMes = {};
      despesasAll.forEach(d => { porMes[d.competencia] = (porMes[d.competencia] || 0) + Number(d.valor); });
      const meses = Object.keys(porMes).sort();
      const valores = meses.map(m => porMes[m]);

      if (chartMensal) chartMensal.destroy();
      chartMensal = new Chart(document.getElementById('chart-mensal'), {
        type: 'bar',
        data: {
          labels: meses.map(Utils.formatCompetencia),
          datasets: [{ data: valores, backgroundColor: '#3b82f6', borderRadius: 4 }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { ticks: { callback: v => Utils.formatCurrency(v) } } },
        },
      });
    }

    function renderTop10(dim) {
      const agrupado = {};
      despesasAll.forEach(d => {
        const chave = dim.chave(d) || '–';
        agrupado[chave] = agrupado[chave] || { valor: 0, qtd: 0 };
        agrupado[chave].valor += Number(d.valor);
        agrupado[chave].qtd   += 1;
      });

      const ordenado = Object.entries(agrupado)
        .sort((a, b) => b[1].valor - a[1].valor)
        .slice(0, 10);

      const totalDim = ordenado.reduce((s, [, v]) => s + v.valor, 0);

      if (chartsTop10[dim.id]) chartsTop10[dim.id].destroy();
      chartsTop10[dim.id] = new Chart(document.getElementById(`chart-${dim.id}`), {
        type: 'bar',
        data: {
          labels: ordenado.map(([nome]) => nome),
          datasets: [{ data: ordenado.map(([, v]) => v.valor), backgroundColor: CORES, borderRadius: 4 }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { x: { ticks: { display: false } }, y: { ticks: { callback: v => Utils.formatCurrency(v) } } },
        },
      });

      document.getElementById(`lista-${dim.id}`).innerHTML = ordenado.map(([nome, v], i) => `
        <div class="flex items-center justify-between text-sm py-1 border-b border-slate-100 last:border-0">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${CORES[i % CORES.length]}"></span>
            <span class="text-slate-700 truncate">${nome}</span>
            <span class="text-xs text-slate-400 flex-shrink-0">${v.qtd} lanç.</span>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <span class="font-medium text-slate-900">${Utils.formatCurrency(v.valor)}</span>
            <span class="text-xs text-slate-400 w-10 text-right">${totalDim ? ((v.valor / totalDim) * 100).toFixed(1) : '0.0'}%</span>
          </div>
        </div>`).join('') || '<p class="text-xs text-slate-400">Sem dados no período.</p>';
    }

    (async () => {
      currentUser = await Layout.init('dashboards', ['ADMIN','GESTOR']);
      if (!currentUser) return;

      montarGridCards();
      await popularFiltros();

      const hoje = new Date();
      const seiseMesesAtras = new Date(hoje.getFullYear(), hoje.getMonth() - 5, 1);
      document.getElementById('f-de').value  = `${seiseMesesAtras.getFullYear()}-${String(seiseMesesAtras.getMonth()+1).padStart(2,'0')}`;
      document.getElementById('f-ate').value = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;

      // Filtros reativos: qualquer mudança já recarrega, sem botão "Aplicar"
      ['f-de','f-ate','f-centro','f-cartao'].forEach(id =>
        document.getElementById(id).addEventListener('change', carregar)
      );

      await carregar();
    })();
  </script>
</body>
</html>
